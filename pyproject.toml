[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-qa-evals"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pytest",
    "deepeval",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "deepeval: marks tests that run deepeval LLM evaluation metrics",
]
